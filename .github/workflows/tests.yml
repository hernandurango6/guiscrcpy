name: Tests

on:
  push:
    branches:
      - main
      - modernize-scrcpy-4
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[PyQt5]" pytest black

      - name: Check formatting
        run: python -m black --check guiscrcpy tests --exclude guiscrcpy/ui

      - name: Run tests
        run: python -m unittest discover -s tests -v
